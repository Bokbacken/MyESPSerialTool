; Serial ESP Helper — UTF-8, format 1. Copy to SerialESPHelper.ini beside the executable.
; Unknown keys, sections and comments survive profile saves.
; [app], [esptool] and [warnings] are shared globally; [profile:*] values are
; profile-scoped. Settings > Global settings saves the shared sections; Save profile
; in the profile settings dialog saves all profile tabs. Apply to session does not write the INI.
; Known keys below are optional and default to the listed values; invalid values fail validation.
; Duplicate sections/keys are rejected. UTF-8 BOM and CRLF are accepted and preserved.
; Maximum INI file size is 4 MiB, including comments and unknown entries.
[app]
; Only format 1 is supported.
format=1
; GLOBAL default log location, relative paths resolve beside this INI.
; Empty per-profile logDirectory inherits this setting.
defaultLogDirectory=logs

[esptool]
; GLOBAL official esptool path, inherited by every profile.
path=
; GLOBAL expected chip used for hard mismatch blocks before flash writes.
; Empty means no expected chip is configured.
defaultChip=
; GLOBAL esptool transfer baud; profiles can override with esptoolBaud.
baud=460800

[warnings]
; GLOBAL reset-capable diagnostic confirmation. Turning this off never disables
; chip mismatch blocks or the explicit final confirmation before writing flash.
confirmReset=true

; Profile names: 1..100 characters, no surrounding whitespace, brackets or '='.
; Names are arbitrary; ESP is only this example. Add another [profile:Your name] section.
[profile:ESP]
; Port/USB serial/path strings: <=4096 UTF-16 code units stored as UTF-8, no NUL/newlines or surrounding whitespace.
; Values are literal (no quote/escape syntax); whitespace followed by ';'/'#' starts a comment.
; An absent explicit port may be saved. A stored USB identity always overrides this port name.
port=
; Optional per-profile esptool overrides. Empty path/chip inherits [esptool].
; esptool baud 0 inherits [esptool] baud.
esptoolPath=
esptoolChip=
esptoolBaud=0
; Baud: decimal 1..4000000; actual baud rates and framing must be supported by the OS/adapter.
baud=115200
; Explicit opt-in: connect automatically when this profile session opens, and retry
; failed initial open attempts. After a successful connection, autoReconnect
; controls reconnection; Pause always blocks it.
; False: opening the session stays disconnected; Connect/Resume tries once initially.
; Selecting a different profile in an existing window never starts it automatically.
; --smoke-test always ignores configuration and never connects.
autoConnect=false
; Reconnect after connection loss; independent of automatic startup connection.
autoReconnect=true
; dataBits: 5,6,7,8; parity: none,even,odd,space,mark.
dataBits=8
parity=none
; stopBits: 1,1.5,2 (adapter/OS support varies).
stopBits=1
; flowControl: none,hardware,software. Hardware flow manages RTS automatically.
flowControl=none
; Boolean values must be exactly true or false. Read-only gates user sends ONLY.
; DTR/RTS below apply on every open regardless of readOnly; hardware flow owns RTS.
; Changing readOnly while connected never reopens or modifies these lines.
; OS/driver open/close may still pulse physical lines; check reset-sensitive hardware.
readOnly=true
dtr=false
rts=false
; Write-completion timeout 100..60000 ms; transmit queue is bounded to 65536 bytes.
writeTimeoutMs=2000
; Open attempts 1..100 per outage, once per second. Missing identity does not
; consume attempts; a duplicate identity is always refused.
retryLimit=5
; A binding is captured on first connection when USB serial + VID/PID are available.
; Clear all three together to forget it: empty usbSerial and vid=pid=-1.
; VID/PID are decimal 0..65535, not hexadecimal.
usbSerial=
vid=-1
pid=-1
; newline: none,lf,cr,crlf. Applies to text and hex sends; history is per-window.
newline=lf
localEcho=false
; This changes scrolling only, never serial reception.
follow=true
; View/export filter, stored by Save profile. text = literal substring;
; expression = quoted wildcard terms and !, &&, ||, parentheses, numeric comparisons.
; Example: ("error*flash" || "warn??") && temp >= 20 && number(2) < 30
; ? = one Unicode character, * = zero or more. Escapes: \? \* \" \\
; Numeric fields match name=value or name: value; number(N) selects the Nth
; standalone decimal number (1-based), not digits within identifiers or units.
; INI strings are literal; as for other string values, avoid whitespace followed
; by ; or # (INI comment markers). Filter help in the app documents full syntax.
filterMode=text
filterText=
filterCase=false
; true = keep all rows and highlight matches; false = show only matches.
filterHighlight=false
; Rows 10..10000; columns 32..16384. Wrap partial lines, total cells capped at 1048576.
terminalRows=2000
lineColumns=4096
; Display-only pending receive bytes (1024..67108864); does not limit disk logs.
displayQueueBytes=262144
logging=false
; .session JSON-lines is ALWAYS recorded on connection attempts, even with logging=false.
; Contains profile/settings/USB identity, host UTC start/end, connected/open errors,
; interruptions and read-only gate changes. It never contains received payload bytes.
; Optional per-profile log-directory override. Empty inherits [app] defaultLogDirectory.
logDirectory=
; Filename stem: letters/digits/_- plus these fields. Date/time are host UTC.
; {profile}, {date}, {time}, {port}, {serial}, {id}; no paths/extensions.
; Unsafe device/profile characters become underscores. ID is only added for {id}.
; Existing/in-use names get a numeric suffix for a new session instead of overwriting.
logName={profile}-{date}-{time}-{id}
; text (default), raw (exact binary bytes), or both. Logging itself is off by default.
; Legacy textLog=false/true without logMode is migrated to raw/both respectively.
logMode=text
; Text extension: dot plus 1..10 letters/digits.
; .meta/.session/.lock are reserved (case-insensitive).
logExtension=.log
; Raw extension, independent of text extension. Both must differ in both mode.
rawLogExtension=.raw
; False: automatic reconnect appends to the same log set (rotation still applies).
; True: close the old set at interruption and create a new set on reconnect.
; Pause/Connect, Session > Split log or settings changes always create a new log set.
newLogOnReconnect=false
; Rotate after 1..1073741824 received bytes. Raw contains ONLY exact bytes.
; Text escaping/timestamps can make text segments larger than this input limit.
logBytes=10485760
; Rotate on next received data after this many seconds (0 = size only).
; 0..31536000; size or elapsed time, whichever comes first.
logSeconds=0
; Retain 1..100 completed segments PLUS active; raw/.meta/.text rotate together.
; logBytes caps received bytes only. Metadata/text have input-linked bounds, not independent byte caps:
; timestamps/escaping can make sidecars larger; each raw read/segment part adds at most one
; offset record, and text may add one final incomplete-UTF-8 flush.
; .session rotates independently at max(logBytes,4096), with settings in continuation headers.
; Whole JSON records/headers can overshoot that threshold; received payload never enters .session.
logRetention=5
; Retention is per log set, never across other sessions/reconnect-created sets.
; Queue bytes 1..67108864 (also <=4096 records); overflow stops logging with a visible fault.
logQueueBytes=4194304
; Optional .meta: reception UTC, raw segment index/offset/length; never device time.
timestampMetadata=false
; Text mode uses incremental UTF-8; invalid bytes/control codes are visibly escaped,
; not a VT rendering. Raw mode preserves binary recordings exactly.
; Host reception UTC prefixes per line, never injected into exact byte logs.
; Terminal prefixes do not change ANSI cursor behavior or filter matching.
terminalTimestamp=false
textTimestamp=false
; false = whole seconds; true = exactly 3 fractional digits, e.g. 12:34:56.123.
timestampMilliseconds=false
