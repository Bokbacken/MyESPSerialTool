; Serial ESP Helper — UTF-8, format 1. Copy to SerialESPHelper.ini beside the executable.
; Unknown keys, sections and comments survive profile saves.
; Known keys below are optional and default to the listed values; invalid values fail validation.
; Duplicate sections/keys are rejected. UTF-8 BOM and CRLF are accepted and preserved.
; Maximum INI file size is 4 MiB, including comments and unknown entries.
[app]
; Only format 1 is supported.
format=1

; Profile names: 1..100 characters, no surrounding whitespace, brackets or '='.
; Names are arbitrary; ESP is only this example. Add another [profile:Your name] section.
[profile:ESP]
; Port/USB serial/path strings: <=4096 UTF-16 code units stored as UTF-8, no NUL/newlines or surrounding whitespace.
; Values are literal (no quote/escape syntax); whitespace followed by ';'/'#' starts a comment.
; An absent explicit port may be saved. A stored USB identity always overrides this port name.
port=
; Baud: decimal 1..4000000; actual baud rates and framing must be supported by the OS/adapter.
baud=115200
; Explicit opt-in: startup connection AND bounded automatic retry/reconnect.
; False: Connect/Resume tries once; loss/failure stays disconnected until another click.
; Selecting a different profile in an existing window never starts it automatically.
; --smoke-test always ignores configuration and never connects.
autoConnect=false
; dataBits: 5,6,7,8; parity: none,even,odd,space,mark.
dataBits=8
parity=none
; stopBits: 1,1.5,2 (adapter/OS support varies).
stopBits=1
; flowControl: none,hardware,software. Hardware flow manages RTS automatically.
flowControl=none
; Boolean values must be exactly true or false. Read-only gates user sends ONLY.
; DTR/RTS below apply on every open regardless of readOnly; hardware flow owns RTS.
; Changing readOnly while connected never reopens or modifies these lines.
; OS/driver open/close may still pulse physical lines; check reset-sensitive hardware.
readOnly=true
dtr=false
rts=false
; Write-completion timeout 100..60000 ms; transmit queue is bounded to 65536 bytes.
writeTimeoutMs=2000
; Open attempts 1..100 per outage, once per second when autoConnect=true.
; Missing identity does not consume attempts; a duplicate identity is always refused.
retryLimit=5
; A binding is captured on first connection when USB serial + VID/PID are available.
; Clear all three together to forget it: empty usbSerial and vid=pid=-1.
; VID/PID are decimal 0..65535, not hexadecimal.
usbSerial=
vid=-1
pid=-1
; newline: none,lf,cr,crlf. Applies to text and hex sends; history is per-window.
newline=lf
localEcho=false
; This changes scrolling only, never serial reception.
follow=true
; Rows 10..10000; columns 32..16384. Wrap partial lines, total cells capped at 1048576.
terminalRows=2000
lineColumns=4096
logging=false
; .session JSON-lines is ALWAYS recorded on connection attempts, even with logging=false.
; Contains profile/settings/USB identity, host UTC start/end, connected/open errors,
; interruptions and read-only gate changes. It never contains received payload bytes.
; Relative directories resolve beside the selected INI, never the working directory.
logDirectory=logs
; Segment bytes 1..1073741824. Raw files contain ONLY exact received bytes.
logBytes=10485760
; Retain 1..100 completed segments PLUS active; raw/.meta/.text rotate together.
; logBytes caps RAW bytes only. .meta/.text have raw-linked bounds, not independent byte caps:
; timestamps/escaping can make sidecars larger; each raw read/segment part adds at most one
; sidecar record, and .text may add one final incomplete-UTF-8 flush record.
; .session rotates independently at max(logBytes,4096), with settings in continuation headers.
; Whole JSON records/headers can overshoot that threshold; received payload never enters .session.
logRetention=5
; Queue bytes 1..67108864 (also <=4096 records); overflow stops logging with a visible fault.
logQueueBytes=4194304
; Optional .meta: reception UTC, raw segment index/offset/length; never device time.
timestampMetadata=false
; Optional readable timestamped UTF-8 .text alongside raw when logging=true.
; Incremental UTF-8, invalid bytes/control codes visibly escaped; not a VT rendering.
textLog=false
